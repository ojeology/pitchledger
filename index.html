  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

  body{padding-bottom:90px}
  header{position:sticky;top:0;z-index:20;background:rgba(14,17,22,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 14px 6px}
  .brand{font-weight:800;font-size:18px;letter-spacing:.3px}
  .brand .dot{color:var(--accent)}
  #stats{display:flex;gap:8px;flex-wrap:wrap;padding:0 14px 8px}
  .chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--dim)}
  .chip b{color:var(--txt)}
  nav{display:flex;overflow-x:auto;gap:4px;padding:0 10px 8px;scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  .tabbtn{flex:1;min-width:88px;border:1px solid transparent;background:transparent;color:var(--dim);padding:8px 6px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
  .tabbtn.on{background:var(--card2);color:var(--accent);border-color:var(--line)}
  main{max-width:760px;margin:0 auto;padding:12px 12px 0}
  .tab{display:none}
  .tab.on{display:block}
  h2{font-size:16px;margin:14px 0 8px;display:flex;align-items:center;gap:8px}
  h2 .count{font-size:12px;color:var(--dim);font-weight:600}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
  .card.redbar{border-left:4px solid var(--red)}
  .card.amberbar{border-left:4px solid var(--amber)}
  .card.greenbar{border-left:4px solid var(--accent)}
  .card.bluebar{border-left:4px solid var(--blue)}
  .card.graybar{border-left:4px solid var(--dim)}
  .cardrow{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
  .cardtitle{font-weight:700;font-size:15px}
  .cardtitle a{color:var(--txt);text-decoration:none}
  .cardtitle a:hover{color:var(--accent)}
  .st{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
  .st-PITCHED{background:#1e2a3a;color:var(--blue)}
  .st-NUDGED1,.st-NUDGED2{background:#2a2416;color:var(--amber)}
  .st-YES{background:#0f2a21;color:var(--accent)}
  .st-NO,.st-CLOSED{background:#2a1616;color:var(--red)}
  .st-PUBLISHED{background:#1c2440;color:var(--purple)}
  .st-PAID{background:#17301f;color:#4ade80}
  .st-PAUSED{background:#232733;color:var(--dim)}
  .countdown{margin:8px 0 4px;font-size:13px}
  .big{font-size:26px;font-weight:800}
  .big.red{color:var(--red)} .big.amber{color:var(--amber)} .big.green{color:var(--accent)} .big.dim{color:var(--dim)}
  .cd-label{color:var(--dim);font-size:12px;margin-left:4px}
  .meta{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;font-size:12.5px;color:var(--dim);margin:6px 0}
  .meta b{color:var(--txt);font-weight:600}
  .meta .full{grid-column:1/-1}
  .btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .btn{border:1px solid var(--line);background:var(--card2);color:var(--txt);border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;cursor:pointer}

  .btn.green{background:#0f2a21;border-color:#14532d;color:var(--accent)}
  .btn.red{background:#2a1616;border-color:#7f1d1d;color:var(--red)}
  .btn.amber{background:#2a2416;border-color:#713f12;color:var(--amber)}
  .btn.blue{background:#16233c;border-color:#1e3a5f;color:var(--blue)}
  .btn.dim{color:var(--dim)}
  .btn:disabled{opacity:.45;cursor:default}
  .log{margin-top:8px;border-top:1px dashed var(--line);padding-top:8px;font-size:12px;color:var(--dim)}
  .log div{margin-bottom:3px}
  .log .d{color:var(--accent);font-weight:700;margin-right:6px}
  details{margin-top:6px}
  summary{cursor:pointer;font-size:12.5px;color:var(--dim);user-select:none}
  .note{background:var(--card2);border-radius:8px;padding:8px;font-size:12.5px;margin-top:6px;white-space:pre-wrap;color:var(--txt)}
  .filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .fchip{background:var(--card);border:1px solid var(--line);color:var(--dim);border-radius:999px;padding:4px 12px;font-size:12px;font-weight:600;cursor:pointer}

  .empty{color:var(--dim);font-size:13px;text-align:center;padding:24px 0}

  .boxkit{font-size:12.5px;color:var(--dim);margin-top:4px}
  .boxkit b{color:var(--txt)}
  .kitlist{margin:4px 0 2px;padding-left:16px}
  .kitlist li{font-size:12.5px;margin-bottom:2px}

  .badge-SEALED{background:#1e2a3a;color:var(--blue);font-size:10px;font-weight:800;padding:2px 8px;border-radius:999px;margin-left:6px}
  .badge-CLOSED{background:#2a1616;color:var(--red);font-size:10px;font-weight:800;padding:2px 8px;border-radius:999px;margin-left:6px}
  .badge-PAUSED{background:#232733;color:var(--dim);font-size:10px;font-weight:800;padding:2px 8px;border-radius:999px;margin-left:6px}

  #modal.on{display:block}

  .modal-actions{display:flex;gap:8px;margin-top:14px}

  .footer{color:var(--dim);font-size:11.5px;text-align:center;padding:20px 0 30px}
  .toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--card2);border:1px solid var(--accent);color:var(--txt);padding:10px 16px;border-radius:10px;font-size:13px;font-weight:600;z-index:99;box-shadow:0 6px 20px rgba(0,0,0,.5);transition:opacity .4s;max-width:90vw;text-align:center}

var state;
function load(){
  var raw = sget("pitchledger_v1");
  if(raw){ try{ var s = JSON.parse(raw); if(s && s.outlets) return s; }catch(e){} }
  var s = seed(); save(s); return s;
}
function save(s){ sset("pitchledger_v1", JSON.stringify(s)); }

/* ================= DATE HELPERS ================= */
function parseISO(iso){
  if(!iso) return null;
  var p = iso.split("-"); if(p.length<3) return null;
  return new Date(+p[0], +p[1]-1, +p[2]);
}
function toISO(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function addDays(iso,n){ var d=parseISO(iso); if(!d) return null; d.setDate(d.getDate()+n); return toISO(d); }
function daysUntil(iso){ var d=parseISO(iso); if(!d) return null; var t=parseISO(toISO(new Date())); return Math.round((d-t)/86400000); }
function fmt(iso){ if(!iso) return "—"; var d=parseISO(iso); return d.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"}); }
function todayISO(){ return toISO(new Date()); }
function wordCount(s){ s=(s||"").trim(); return s ? s.split(/\s+/).length : 0; }
function toast(msg){
  var d=document.createElement("div"); d.className="toast"; d.textContent=msg;
  document.body.appendChild(d);
  setTimeout(function(){ d.classList.add("out"); setTimeout(function(){ d.remove(); },450); },2000);
}

function nudgeDate(o){ return o.pitchDate?addDays(o.pitchDate,o.nudgeDays):null; }
function closeDate(o){ return o.pitchDate?addDays(o.pitchDate,o.closeDays):null; }

/* ================= URGENCY ================= */
function urgency(o){
  if(!ACTIVE.includes(o.status)) return null;
  if(!o.pitchDate) return {level:"none",label:"Set pitch date",days:null};
  if(o.status==="NUDGED2"){
    var cd=closeDate(o), d=daysUntil(cd);
    if(d<0) return {level:"red",label:"Overdue — close thread or decide",days:d};
    if(d<=7) return {level:"amber",label:"Close decision due in "+d+"d",days:d};
    return {level:"ok",label:"Close decision in "+d+"d",days:d};
  }
  var nd=nudgeDate(o), d=daysUntil(nd);
  if(d<0) return {level:"red",label:"OVERDUE — nudge now ("+(-d)+"d late)",days:d};
  if(d===0) return {level:"red",label:"Nudge due TODAY",days:0};
  if(d<=7) return {level:"amber",label:"Nudge in "+d+"d",days:d};
  return {level:"ok",label:"Nudge in "+d+"d",days:d};
}
function cardClass(o){
  var u=urgency(o);
  if(u && u.level==="red") return "redbar";
  if(u && u.level==="amber") return "amberbar";
  if(o.status==="YES") return "greenbar";
  if(o.status==="PITCHED"||o.status==="NUDGED1"||o.status==="NUDGED2") return "bluebar";
  return "graybar";
}

  var waiting=act.filter(o=>{var u=urgency(o);return !u||u.level==="ok";}).sort((a,b)=>(urgency(a)&&urgency(a).days||999)-(urgency(b)&&urgency(b).days||999));

var filter="ALL", query="";
function renderOutlets(){
  var el=document.getElementById("tab-outlets");
  var list=state.outlets.slice();

  if(query) list=list.filter(o=>(o.name+" "+o.claim+" "+(o.editorName||"")).toLowerCase().includes(query.toLowerCase()));
  list.sort((a,b)=>{
    var ua=urgency(a),ub=urgency(b);
    var ra=(ua?((ua.days===null?999:ua.days)):998), rb=(ub?((ub.days===null?999:ub.days)):998);
    return ra-rb;
  });
  var h='<div class="filters">';
  ["ALL","PITCHED","NUDGED1","NUDGED2","YES","NO","PUBLISHED","PAID","PAUSED"].forEach(f=>{
    var n=f==="ALL"?state.outlets.length:state.outlets.filter(o=>o.status===f).length;

}

function outletCard(o){
  var u=urgency(o);
  var cd="";
  if(o.status==="YES") cd='<div class="countdown" style="color:var(--accent)">✅ Yes — <b>'+fmt(nudgeDate(o)||(o.pitchDate?addDays(o.pitchDate,31):""))+'</b> follow-up if silent · draft ready: 1 Sep</div>';
  else if(u && u.level==="red") cd='<div class="countdown"><span class="big red">'+(u.days>0?"+"+u.days:u.days)+'</span><span class="cd-label">'+esc(u.label)+'</span></div>';
  else if(u && u.level==="amber") cd='<div class="countdown"><span class="big amber">'+u.days+'</span><span class="cd-label">days until nudge — '+fmt(nudgeDate(o))+'</span></div>';
  else if(u && u.level==="ok") cd='<div class="countdown"><span class="big green">'+u.days+'</span><span class="cd-label">days until nudge — '+fmt(nudgeDate(o))+'</span></div>';
  else if(u && u.level==="none") cd='<div class="countdown"><span class="big dim">—</span><span class="cd-label">set the pitch date to start the countdown</span></div>';
  else if(o.status==="PAUSED") cd='<div class="countdown" style="color:var(--dim)">⏸ Paused — kit reserved</div>';
  else if(o.status==="NO"||o.status==="CLOSED") cd='<div class="countdown" style="color:var(--red)">✗ Closed</div>';
  else if(o.status==="PUBLISHED") cd='<div class="countdown" style="color:var(--purple)">📄 Published</div>';
  else if(o.status==="PAID") cd='<div class="countdown" style="color:var(--accent)">💰 Paid</div>';

  var web=o.website?'<a href="'+esc(o.website)+'" target="_blank" rel="noopener">'+esc(o.website.replace(/^https?:\/\//,""))+' ↗</a>':"";
  var d1='Pitched: <b>'+(o.pitchDate?fmt(o.pitchDate):"<span style='color:var(--amber)'>not set</span>")+'</b>';
  var d2='Nudge: <b>'+fmt(nudgeDate(o))+'</b>';
  var d3='Close: <b>'+fmt(closeDate(o))+'</b>';

  var btns="";
  if(o.status==="PITCHED"||o.status==="NUDGED1"){
    btns+='<button class="btn amber" data-act="mark" data-id="'+o.id+'" data-to="'+(o.status==="PITCHED"?"NUDGED1":"NUDGED2")+'">🔔 Nudge sent</button>';
    btns+='<button class="btn green" data-act="mark" data-id="'+o.id+'" data-to="YES">✅ Yes</button>';
    btns+='<button class="btn red" data-act="mark" data-id="'+o.id+'" data-to="NO">✗ No</button>';
    btns+='<button class="btn dim" data-act="mark" data-id="'+o.id+'" data-to="PAUSED">⏸</button>';
  } else if(o.status==="NUDGED2"){
    btns+='<button class="btn green" data-act="mark" data-id="'+o.id+'" data-to="YES">✅ Yes</button>';
    btns+='<button class="btn red" data-act="mark" data-id="'+o.id+'" data-to="CLOSED">✗ Close</button>';
  } else if(o.status==="YES"){
    btns+='<button class="btn amber" data-act="mark" data-id="'+o.id+'" data-to="PUBLISHED">📄 Published</button>';
    btns+='<button class="btn red" data-act="mark" data-id="'+o.id+'" data-to="NO">✗ Declined</button>';
  } else if(o.status==="PUBLISHED"){
    btns+='<button class="btn green" data-act="mark" data-id="'+o.id+'" data-to="PAID">💰 Paid</button>';
  } else if(o.status==="PAUSED"||o.status==="NO"||o.status==="CLOSED"){
    btns+='<button class="btn blue" data-act="mark" data-id="'+o.id+'" data-to="PITCHED">↩ Reopen</button>';
  }
  btns+='<button class="btn" data-act="edit" data-id="'+o.id+'">✏️ Edit</button>';

  var logh='';
  if(o.log&&o.log.length){
    logh='<div class="log">'+o.log.slice().reverse().map(l=>'<div><span class="d">'+fmt(l.d)+'</span>'+esc(l.e)+'</div>').join("")+'</div>';
  }
  var noteh=o.notes?'<div class="note">📝 '+esc(o.notes)+'</div>':"";

  var h='<div class="card '+cardClass(o)+'">';
  h+='<div class="cardrow"><div style="min-width:0"><div class="cardtitle">'+esc(o.name)+' '+(web?'<span style="font-size:12px;color:var(--dim)">'+web+'</span>':'')+'</div></div><span class="st st-'+o.status+'">'+ST_LABEL[o.status]+'</span></div>';
  h+=cd;
  h+='<div class="meta"><span>'+d1+'</span><span>'+d2+'</span><span>'+d3+'</span><span>Box: <b>'+esc(o.box)+'</b></span><span class="full">💡 <b>'+esc(o.claim)+'</b></span></div>';
  if(o.editorName||o.editorEmail) h+='<div class="meta"><span>👤 <b>'+esc(o.editorName||"—")+'</b></span><span>✉️ '+esc(o.editorEmail||"")+'</span></div>';
  h+='<div class="btns">'+btns+'</div>';
  h+=noteh;
  if(o.kit||o.offLimits){
    h+='<details><summary>Box kit & off-limits</summary><div class="note" style="margin-top:4px">📦 <b>Kit:</b> '+esc(o.kit||"—")+'<br>🚫 <b>Off-limits:</b> '+esc(o.offLimits||"—")+'</div></details>';
  }
  h+=logh;
  h+='</div>';
  return h;
}

function renderDraftEditor(id){

  h+='<textarea id="d_text" placeholder="Paste your draft here… it auto-saves.">'+esc(d.text)+'</textarea>';
  h+='<div class="hint" id="d_saved">Autosave is on · last saved '+fmt(d.updated)+' · data stays on this device</div></div>';
  el.innerHTML=h;
  var ta=document.getElementById("d_text");
  var ti=document.getElementById("d_title");
  var oi=document.getElementById("d_outlet");
  var timer=null;
  function saveDraftNow(){
    d.title=ti.value; d.outlet=oi.value; d.text=ta.value; d.updated=todayISO();

  function debounceSave(){ clearTimeout(timer); timer=setTimeout(saveDraftNow,600); }
  ta.addEventListener("input",debounceSave);
  ti.addEventListener("input",debounceSave);
  oi.addEventListener("input",debounceSave);
}

function copyDraft(id){
  var d=state.drafts.find(function(x){ return x.id===id; }); if(!d) return;
  var txt=d.text||"";
  function fb(){ var t=document.createElement("textarea"); t.value=txt; document.body.appendChild(t); t.select(); try{ document.execCommand("copy"); toast("Copied to clipboard ✓"); }catch(e){ toast("Copy failed — select the text manually"); } t.remove(); }
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(function(){ toast("Copied to clipboard ✓"); },fb); } else { fb(); }
}

  h+='<div class="card"><div class="cardtitle" style="margin-bottom:8px">💾 Backup & restore</div>';
  h+='<div class="meta" style="margin-bottom:8px"><span class="full">Your data lives in this browser. Export a backup file — and keep it safe. Import restores everything.</span></div>';
  h+='<div class="btns"><button class="btn green" data-act="export">⬇ Export backup (JSON)</button><label class="btn blue" style="display:inline-block">⬆ Import backup<input type="file" id="importFile" accept=".json" style="display:none"></label><button class="btn red" data-act="reset">🗑 Reset all data</button><button class="btn red" data-act="wipe">🧹 Wipe data (start empty)</button></div><div class="hint" style="margin-top:6px">Reset = back to the original seed. Wipe = empty everything (outlets, boxes, drafts) — use before sharing the app publicly, or for a fresh start.</div></div>';
  h+='<div class="card"><div class="cardtitle" style="margin-bottom:4px">📅 Dates to remember</div><div class="meta"><span class="full">Afrolicious follow-up: <b>4–7 Sep 2026</b></span><span class="full">2 new pitches due: <b>~21 Aug</b></span><span class="full">Byline kit reserved (paused by choice)</span></div></div>';
  h+='<div class="card"><div class="cardtitle" style="margin-bottom:4px">🧭 Quick rules</div><div class="meta"><span class="full">1) One kit, one box — nothing written for a WAITING box</span><span class="full">2) When one replies → draft ONLY that one</span><span class="full">3) Closed box recycles → kit returns to the pool</span><span class="full">4) Same event, same job in two essays = forbidden</span></div></div>';
  el.innerHTML=h;
}

/* ================= ESCAPE ================= */
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

/* ================= MODAL: OUTLET FORM ================= */
function outletForm(o){
  o=o||{};
  var f=function(name,val){ return val==null?"":esc(val); };
  var h='<div class="modal-box"><h3>'+(o.id?"Edit outlet":"New outlet")+'</h3>';
  h+='<div class="field"><label>Outlet name *</label><input id="f_name" value="'+f("",o.name)+'" placeholder="e.g. TechCabal"></div>';
  h+='<div class="field"><label>Website</label><input id="f_website" value="'+f("",o.website)+'" placeholder="https://…"></div>';
  h+='<div class="field"><label>Type</label><select id="f_type"><option>Magazine</option><option>Platform</option><option>Newsletter</option><option>Journal</option><option>Contest</option></select></div>';
  h+='<div class="field"><label>Status</label><select id="f_status">'+STATUS.map(s=>'<option'+(o.status===s?" selected":"")+'>'+s+'</option>').join("")+'</select></div>';
  h+='<div class="field"><label>Box (kit owner)</label><select id="f_box">'+["OPEN","SEALED","PAUSED","CLOSED"].map(b=>'<option'+(o.box===b?" selected":"")+'>'+b+'</option>').join("")+'</select></div>';
  h+='<div class="field"><label>Date pitched</label><input type="date" id="f_pitch" value="'+f("",o.pitchDate)+'"><div class="hint">Starts the countdown. Leave empty until you know it.</div></div>';
  h+='<div class="field"><label>Nudge after (days)</label><input type="number" id="f_nudge" min="1" value="'+(o.nudgeDays||21)+'"></div>';
  h+='<div class="field"><label>Close after (days)</label><input type="number" id="f_close" min="1" value="'+(o.closeDays||42)+'"></div>';
  h+='<div class="field"><label>Editor name</label><input id="f_editor" value="'+f("",o.editorName)+'"></div>';
  h+='<div class="field"><label>Editor email</label><input id="f_email" value="'+f("",o.editorEmail)+'"></div>';
  h+='<div class="field"><label>One-sentence claim</label><textarea id="f_claim">'+f("",o.claim)+'</textarea></div>';
  h+='<div class="field"><label>Kit (scenes this essay owns)</label><textarea id="f_kit">'+f("",o.kit)+'</textarea></div>';
  h+='<div class="field"><label>Off-limits (belongs to other boxes)</label><textarea id="f_off">'+f("",o.offLimits)+'</textarea></div>';
  h+='<div class="field"><label>Word count</label><input id="f_words" value="'+f("",o.wordCount)+'"></div>';
  h+='<div class="field"><label>Pay</label><input id="f_pay" value="'+f("",o.pay)+'"></div>';
  h+='<div class="field"><label>Payment method</label><input id="f_method" value="'+f("",o.payMethod)+'"></div>';
  h+='<div class="field"><label>Published link</label><input id="f_publink" value="'+f("",o.publishedLink)+'"></div>';
  h+='<div class="field"><label>Notes</label><textarea id="f_notes">'+f("",o.notes)+'</textarea></div>';
  h+='<div class="modal-actions"><button class="btn green" data-act="saveoutlet" data-id="'+f("",o.id)+'">💾 Save</button><button class="btn dim" data-act="closemodal">Cancel</button></div>';
  h+='</div>';
  return h;
}

function openModal(html){ var m=document.getElementById("modal"); m.innerHTML=html; m.classList.add("on"); }
function closeModal(){ document.getElementById("modal").classList.remove("on"); }

/* ================= ACTIONS ================= */
function markStatus(id,to){
  var o=state.outlets.find(x=>x.id===id); if(!o) return;
  o.status=to;
  var d=todayISO();
  if(to==="NUDGED1") o.log.push({d:d,e:"Nudge #1 sent."});
  if(to==="NUDGED2") o.log.push({d:d,e:"Nudge #2 sent."});
  if(to==="YES") o.log.push({d:d,e:"EDITOR SAID YES."});
  if(to==="NO") o.log.push({d:d,e:"Declined — kit returns to the pool."});
  if(to==="CLOSED") o.log.push({d:d,e:"Thread closed (no reply)."});
  if(to==="PUBLISHED") o.log.push({d:d,e:"Published!"});
  if(to==="PAID") o.log.push({d:d,e:"Paid 💰."});
  if(to==="PAUSED") o.log.push({d:d,e:"Paused (by choice)."});
  if(to==="PITCHED") o.log.push({d:d,e:"Reopened."});
  save(state); renderAll();
}

function saveOutlet(id){
  var g=function(x){ return document.getElementById(x).value; };
  var isNew=!id;
  var o=isNew?{id:"o"+Date.now(),log:[]}:state.outlets.find(x=>x.id===id);
  o.name=g("f_name")||"Untitled"; o.website=g("f_website"); o.type=g("f_type");
  o.status=g("f_status"); o.box=g("f_box"); o.pitchDate=g("f_pitch");
  o.nudgeDays=parseInt(g("f_nudge"),10)||21; o.closeDays=parseInt(g("f_close"),10)||42;
  o.editorName=g("f_editor"); o.editorEmail=g("f_email"); o.claim=g("f_claim");
  o.kit=g("f_kit"); o.offLimits=g("f_off"); o.wordCount=g("f_words");
  o.pay=g("f_pay"); o.payMethod=g("f_method"); o.publishedLink=g("f_publink"); o.notes=g("f_notes");
  if(isNew) state.outlets.push(o);
  save(state); closeModal(); renderAll();
}

function exportData(){
  var blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  var a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="pitchledger-backup-"+todayISO()+".json";
  document.body.appendChild(a); a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},500);
}
function importData(file){
  var r=new FileReader();
  r.onload=function(){
    try{
      var s=JSON.parse(r.result);
      if(!s.outlets) throw new Error("bad");
      state=s; save(state); renderAll(); alert("✅ Backup imported.");
    }catch(e){ alert("❌ That file doesn't look like a PitchLedger backup."); }
  };
  r.readAsText(file);
}

/* ================= EVENTS ================= */
document.addEventListener("click",function(e){
  var t=e.target;
  while(t && !t.getAttribute("data-act")) t=t.parentElement;
  if(!t) return;
  var act=t.getAttribute("data-act");
  var id=t.getAttribute("data-id");
  if(act==="mark"){ markStatus(id,t.getAttribute("data-to")); }
  else if(act==="edit"){ var o=state.outlets.find(x=>x.id===id); openModal(outletForm(o)); }
  else if(act==="newoutlet"){ openModal(outletForm(null)); }
  else if(act==="saveoutlet"){ saveOutlet(id); }
  else if(act==="closemodal"){ closeModal(); }
  else if(act==="export"){ exportData(); }
  else if(act==="reset"){ if(confirm("Reset ALL data to the original seed? This cannot be undone.")){ state=seed(); save(state); renderAll(); } }
  else if(act==="wipe"){ if(confirm("Wipe ALL data (outlets, boxes, drafts, tasks)? Export a backup first if you want to keep anything. This cannot be undone.")){ state.outlets=[]; state.opps=[]; state.boxes=[]; state.tasks=[]; state.drafts=[]; state._openDraft=null; save(state); renderAll(); toast("All data wiped — starting clean"); } }
  else if(act==="newdraft"){ var nd={id:"d"+Date.now(),title:"Untitled draft",outlet:"",updated:todayISO(),text:""}; state.drafts.push(nd); state._openDraft=nd.id; save(state); renderDrafts(); }
  else if(act==="opendraft"){ state._openDraft=id; renderDrafts(); }
  else if(act==="backdrafts"){ state._openDraft=null; renderDrafts(); }
  else if(act==="deletedraft"){ var di=state.drafts.findIndex(function(x){ return x.id===id; }); if(di>-1 && confirm("Delete this draft?")){ state.drafts.splice(di,1); if(state._openDraft===id) state._openDraft=null; save(state); renderDrafts(); toast("Draft deleted"); } }
  else if(act==="copydraft"){ copyDraft(id); }
  else if(act==="savename"){ var n=document.getElementById("setName").value; state.appName=n||"PitchLedger"; save(state); renderAll(); }
  else if(act==="addtask"){ var inp=document.getElementById("newTask"); var v=(inp.value||"").trim(); if(v){ state.tasks.push({t:v,done:false}); save(state); renderAll(); } }
});
document.addEventListener("change",function(e){
  if(e.target.id==="importFile" && e.target.files.length){ importData(e.target.files[0]); e.target.value=""; }
  var st=e.target.getAttribute("data-oppstatus");
  if(st){ var o=state.opps.find(x=>x.id===st); if(o){ o.status=e.target.value; save(state); renderStats(); } }
  var tk=e.target.getAttribute("data-task");
  if(tk!==null){ state.tasks[+tk].done=e.target.checked; save(state); }
});
document.addEventListener("input",function(e){
  if(e.target.id==="outletSearch"){ query=e.target.value; renderOutlets(); }
});
document.addEventListener("click",function(e){
  var f=e.target.getAttribute("data-filter");
  if(f){ filter=f; renderOutlets(); }
  var o=e.target.getAttribute("data-oppfilter");
  if(o!==null){ oppFilter=+o; renderOpps(); }
  var tb=e.target.getAttribute("data-tab");
  if(tb){ switchTab(tb); }
});

function switchTab(name){
  document.querySelectorAll(".tabbtn").forEach(b=>b.classList.toggle("on",b.getAttribute("data-tab")===name));
  document.querySelectorAll(".tab").forEach(s=>s.classList.toggle("on",s.id==="tab-"+name));
}

function renderAll(){
  document.getElementById("appName").textContent=state.appName||"PitchLedger";
  renderStats(); renderToday(); renderOutlets(); renderOpps(); renderBoxes(); renderDrafts(); renderSettings();
}

/* ================= BOOT ================= */
state=load();
renderAll();
setInterval(function(){ renderStats(); renderToday(); renderOutlets(); },60000);
try{ if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(function(){}); } }catch(e){}
</script>
