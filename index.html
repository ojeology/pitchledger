<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f3ea">
<title>PitchLedger — a working journal</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --paper:#f7f3ea; --card:#fffdf7; --ink:#221c13; --dim:#847a68; --faint:#a89d87;
  --rule:#d9cfba; --hair:#e6ddc9; --accent:#8a2f2b; --green:#2e5d4b; --gold:#96742a;
  --amber:#9a6b1f; --blue:#2f4d6b;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font:16px/1.55 Georgia,"Times New Roman",serif;
  padding:18px 16px 90px;max-width:860px;margin:0 auto}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
a{color:var(--accent)}
.micro{font:600 10.5px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}

/* ---------- masthead ---------- */
.mast{border-bottom:3px double var(--ink);padding-bottom:14px;margin-bottom:14px}
.mast-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand{font-size:26px;font-weight:700;letter-spacing:.32em;text-transform:uppercase}
.brand span{color:var(--accent)}
.todaydate{font-style:italic;color:var(--dim);font-size:14.5px}
.tagline{font-style:italic;color:var(--dim);margin-top:4px;font-size:14.5px}

/* ---------- nav ---------- */
.nav{display:flex;gap:2px 22px;flex-wrap:wrap;border-bottom:1px solid var(--rule);
  padding-bottom:0;margin-bottom:22px}
.nav button{font:600 11px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  letter-spacing:.16em;text-transform:uppercase;color:var(--dim);
  padding:10px 2px 9px;border-bottom:2px solid transparent}
.nav button.on{color:var(--ink);border-bottom-color:var(--accent)}

/* ---------- section heads ---------- */
.shead{display:flex;align-items:center;gap:12px;margin:26px 0 10px}
.shead .micro{color:var(--ink);white-space:nowrap}
.shead:after{content:"";flex:1;border-top:1px solid var(--rule)}
.shead .cnt{font-style:italic;color:var(--faint);font-size:13px}

/* ---------- stat row ---------- */
.stats{display:flex;flex-wrap:wrap;border:1px solid var(--rule);background:var(--card)}
.stat{flex:1 1 110px;padding:12px 14px;border-right:1px solid var(--hair);text-align:left}
.stat:last-child{border-right:none}
.stat b{display:block;font-size:26px;line-height:1.15}
.stat span{display:block;margin-top:2px}

/* ---------- journal entries (ledger) ---------- */
.entry{display:grid;grid-template-columns:86px 1fr 96px;gap:4px 14px;padding:15px 4px;
  border-bottom:1px solid var(--hair);align-items:start}
.entry:hover{background:var(--card)}
.e-date{font-size:12.5px;color:var(--dim);font-style:italic;padding-top:4px}
.e-date b{display:block;font-style:normal;font-size:14px;color:var(--ink)}
.e-name{font-size:19px;line-height:1.25}
.e-name a{text-decoration:none;color:inherit}
.e-name a:hover{color:var(--accent)}
.e-claim{font-style:italic;color:var(--dim);font-size:14px;margin-top:3px}
.e-meta{margin-top:6px;display:flex;flex-wrap:wrap;gap:4px 14px}
.e-meta .micro{color:var(--faint)}
.stamp{justify-self:end;display:inline-block;transform:rotate(-2.5deg);margin-top:4px;
  border:2px solid currentColor;border-radius:3px;padding:3px 7px;
  font:700 9.5px/1.2 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  letter-spacing:.12em;text-transform:uppercase;text-align:center}
.st-PITCHED{color:var(--blue)} .st-NUDGED1,.st-NUDGED2{color:var(--amber)}
.st-YES{color:var(--green)} .st-PUBLISHED{color:var(--gold)} .st-PAID{color:var(--green)}
.st-NO,.st-CLOSED{color:var(--faint)} .st-PAUSED{color:var(--dim)}
.daycount{justify-self:end;text-align:right;margin-top:2px}
.daycount b{font-size:21px}
.daycount span{display:block}

/* ---------- details / log ---------- */
details{margin-top:8px}
summary{list-style:none;cursor:pointer}
summary::-webkit-details-marker{display:none}
summary .micro:hover{color:var(--accent)}
.det{background:var(--card);border:1px solid var(--hair);padding:12px 14px;margin-top:8px}
.detrow{display:flex;gap:12px;padding:5px 0;border-bottom:1px dotted var(--hair);font-size:14px}
.detrow:last-child{border-bottom:none}
.detrow .k{flex:0 0 118px}
.detrow .v{flex:1}
.log{margin-top:8px}
.logentry{padding:6px 0;border-bottom:1px dotted var(--hair);font-size:13.5px}
.logentry i{color:var(--faint);margin-right:8px}
.bigbtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}

/* ---------- buttons ---------- */
.bbtn{font:600 11px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:.12em;
  text-transform:uppercase;border:1px solid var(--ink);padding:9px 13px;background:var(--card);color:var(--ink)}
.bbtn:hover{background:var(--ink);color:var(--paper)}
.bbtn.green{background:var(--green);border-color:var(--green);color:#fdfbf5}
.bbtn.green:hover{background:#24493b}
.bbtn.gray{border-color:var(--rule);color:var(--dim)}
.bbtn.red{border-color:var(--accent);color:var(--accent)}
.bbtn.red:hover{background:var(--accent);color:var(--paper)}
.fab{position:fixed;right:18px;bottom:18px;background:var(--ink);color:var(--paper);
  font:600 11.5px/1 -apple-system,sans-serif;letter-spacing:.14em;text-transform:uppercase;
  padding:15px 18px;border-radius:999px;box-shadow:0 6px 18px rgba(34,28,19,.35);z-index:30}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.fchip{font:600 10.5px/1 -apple-system,sans-serif;letter-spacing:.1em;text-transform:uppercase;
  border:1px solid var(--rule);color:var(--dim);padding:7px 10px;border-radius:999px;background:var(--card)}
.fchip.on{border-color:var(--ink);color:var(--paper);background:var(--ink)}

/* ---------- today blocks ---------- */
.need{display:flex;gap:12px;align-items:baseline;padding:11px 2px;border-bottom:1px solid var(--hair)}
.need .n-act{flex:0 0 150px}
.need .n-what{flex:1;font-size:15px}
.need .n-day{font-style:italic;color:var(--accent);white-space:nowrap;font-size:13.5px}
.empty{font-style:italic;color:var(--faint);padding:14px 2px;font-size:14.5px}

/* ---------- boxes / opps ---------- */
.boxcard{background:var(--card);border:1px solid var(--rule);border-top:3px solid var(--gold);
  padding:14px 16px;margin-bottom:12px}
.boxcard.sealed{border-top-color:var(--accent)}
.boxcard.paused{border-top-color:var(--faint)}
.boxcard.openb{border-top-color:var(--green)}
.boxcard h3{font-size:18px;margin-bottom:2px}
.boxkit{margin-top:8px}
.boxkit li{margin-left:18px;font-size:14px;padding:2px 0}
.opp{display:flex;gap:12px;padding:11px 2px;border-bottom:1px solid var(--hair);align-items:baseline}
.opp .o-tier{flex:0 0 34px;font-size:20px;color:var(--faint);font-style:italic}
.opp .o-body{flex:1}
.opp .o-name{font-size:16.5px}
.opp .o-pay{font-style:italic;color:var(--green);font-size:14px}
.opp .o-note{font-size:13.5px;color:var(--dim);margin-top:2px}

/* ---------- drafts ---------- */
.draftrow{display:flex;justify-content:space-between;gap:10px;padding:11px 2px;
  border-bottom:1px solid var(--hair);align-items:baseline;cursor:pointer}
.draftrow:hover{background:var(--card)}
.draftrow .d-title{font-size:16px}
.draftrow .d-meta{font-size:12.5px;color:var(--faint);font-style:italic;white-space:nowrap}
.darea{width:100%;min-height:340px;border:1px solid var(--rule);background:var(--card);
  padding:14px;font:15px/1.7 Georgia,serif;color:var(--ink);resize:vertical}
.darea:focus{outline:none;border-color:var(--ink)}
.wc{text-align:right;font-style:italic;color:var(--faint);font-size:12.5px;margin-top:4px}

/* ---------- tasks ---------- */
.task{display:flex;gap:10px;padding:8px 2px;border-bottom:1px solid var(--hair);align-items:baseline}
.task input{appearance:none;width:15px;height:15px;border:1.5px solid var(--dim);flex:0 0 15px;position:relative;top:2px}
.task input:checked{background:var(--green);border-color:var(--green)}
.task span{font-size:15px}
.task.done span{text-decoration:line-through;color:var(--faint)}

/* ---------- modal / toast ---------- */
.modal{position:fixed;inset:0;background:rgba(34,28,19,.55);display:none;z-index:40;
  padding:20px 14px;overflow:auto}
.modal.on{display:block}
.modal-box{background:var(--paper);border:1px solid var(--ink);max-width:620px;margin:20px auto;
  padding:22px 22px 18px;box-shadow:0 14px 44px rgba(0,0,0,.3)}
.modal-box h3{font-size:21px;margin-bottom:14px;border-bottom:2px solid var(--ink);padding-bottom:8px}
.field{margin-bottom:12px}
.field label{display:block;margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;background:transparent;color:var(--ink);
  border:none;border-bottom:1px solid var(--rule);padding:6px 2px;font:15px Georgia,serif}
.field textarea{min-height:64px;resize:vertical;line-height:1.5}
.field input:focus,.field select,.field textarea:focus{outline:none;border-bottom-color:var(--ink)}
.hint{font-size:12px;color:var(--faint);font-style:italic;margin-top:3px}
.modal-actions{display:flex;gap:10px;margin-top:16px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(80px);
  background:var(--ink);color:var(--paper);padding:11px 18px;font:14px Georgia,serif;
  transition:transform .25s;z-index:50;max-width:88vw;text-align:center}
.toast.on{transform:translateX(-50%) translateY(0)}

@media(max-width:640px){
  .entry{grid-template-columns:1fr}
  .e-date{order:3;padding-top:0}
  .stamp{justify-self:start;order:2;margin-top:6px}
  .daycount{text-align:left;justify-self:start;order:1;margin-top:6px;display:inline-block}
  .daycount b{font-size:17px}
  .stat b{font-size:21px}
  .brand{font-size:20px;letter-spacing:.22em}
  .need{flex-wrap:wrap}
}
</style>
</head>
<body>
<header class="mast">
  <div class="mast-row">
    <div class="brand" id="brandName">PITCH<span>LEDGER</span></div>
    <div class="todaydate" id="todayDate"></div>
  </div>
  <p class="tagline">A working journal of pitches sent, answers waited on, and money earned.</p>
</header>
<nav class="nav" id="nav"></nav>
<main id="view"></main>
<button class="fab" data-nav="ledger" data-new="1">＋ New pitch</button>
<div class="modal" id="modal"></div>
<div class="toast" id="toast"></div>

"id": "noema", "name": "Noema", "status": "SEALED", "claim": "AI is becoming educational infrastructure, compressing years of learning into months.", "kit": ["Libraries vs AI (most distinctive scene)", "Self-directed learning as the new mode", "Global examples — Kenya, India, Brazil", "Credentialing argument"], "offLimits": ["Nigerian phone-coding texture", "Personal route into software", "'Shortcuts'"]}, {"id": "republic", "name": "The Republic", "status": "SEALED", "claim": "AI is changing what ambition looks like for young Nigerians.", "kit": ["Nigerian learning culture (WhatsApp groups, YouTube, community)", "Lagos fieldwork + interviews (TO DO)", "Before/after examples in classrooms"], "offLimits": ["'AI + effort = opportunity' ending", "Infrastructure thesis", "The bridge"]}, {"id": "incomedaily", "name": "Income Daily", "status": "SEALED", "claim": "The internet sold me wealth; programming taught me value.", "kit": ["Trading bots and online schemes", "Becoming a center manager (claim it)", "Work beats hype — the money numbers"], "offLimits": ["The word 'shortcuts'", "Gambling addiction psychology", "AI philosophy"]}, {"id": "byline", "name": "Byline", "status": "PAUSED", "claim": "The real addiction wasn't gambling — it was shortcuts.", "kit": ["Sleeping under the bridge (opening)", "₦98k win from ₦200", "₦500k loss", "Recovery through programming"], "offLimits": ["Betting shop interior", "Family break", "Access/opportunity"]}, {"id": "vox", "name": "Vox First Person", "status": "SEALED", "claim": "Gambling addiction isn't just about money — it changes how you think and how hard rebuilding is.", "kit": ["Betting shop interior", "The family break", "Cognitive damage — how gambling rewires thinking", "Rebuild as a social story", "Fortebet job setting"], "offLimits": ["The bridge scene", "The 'shortcuts' thesis", "₦98k / ₦500k numbers"]}, {"id": "crackedshop", "name": "The Betting Shop (Cracked feature)", "status": "SEALED", "claim": "5 Ways Working in a Nigerian Betting Shop Feels Like Being Trapped in a Horror Movie — pitch v2 drafted (cracked-pitch.md), character/set-piece version", "kit": ["1. The Virtual-Game Prophet — notebook + biro to decode an RNG; blames his handwriting when the system fails", "2. The Man Who Already Spent the Money — accumulator unfinished, winnings half-spent in promises; loses the money twice", "3. The 'I Told You!' Prophet — one safe pick = football oracle; the six misses are expunged from the record", "4. The Blackout — UCL night, 50+ people, no light, no network, staff trapped behind the counter; the cheer and groan arrive together", "5. The Regular Who Turns — friendly guy forces the cubicle door after a 6–0 destruction; back to friendly in 20 minutes (PSEUDONYM, never real names)", "BENCH: machine-ate-ticket · I-played-yesterday detective · keeps-coming-back regular", "FEED THE BANK: one real line per real moment, straight into this box"], "offLimits": ["The bridge, the ₦98k win, the poultry collapse (personal addiction scenes — pending at Lagos Review/Vox)", "The locker-money reflection (used in the Lagos Review essay)", "ANONYMIZATION RULE (non-negotiable): no company name, no real customer names ('let's call him X' convention only), no internal numbers — still employed there"]}], "tasks": [{"t": "Publish 1–2 pieces on Medium — first clip THIS WEEK", "done": false}, {"t": "Afrolicious draft ready by 1 Sep (door scenes only)", "done": false}, {"t": "Send Afrolicious a reminder 4–7 Sep if she's silent", "done": false}, {"t": "Pitch TechCabal ($175) + Zikoko (pays)", "done": false}, {"t": "Apply: African Arguments fellowship (~$250/article)", "done": false}, {"t": "2 new pitches every 2 weeks — next batch ~21 Aug", "done": false}, {"t": "Deploy PitchLedger to GitHub Pages", "done": false}, {"t": "WhatCulture: sign up + pitch 3 listicle ideas (locked in)", "done": false}, {"t": "4 Sep — Afrolicious pitch goes to editorial: final draft + 2 backup pitches READY", "done": false}, {"t": "Efiko: lf."}, {"id": "d-accidental", "title": "The Accidental Developer (1,480w — Noema reject, FREE to re-pitch)", "outlet": "Noema (returned)", "updated": "2026-08-28", "text": "The Accidental Developer\nHow AI and a smartphone changed the way I entered software engineering\n\nI didn't start learning to program because I loved technology.\n\nI started because I wanted money.\n\nI spent countless hours online watching videos that promised financial freedom through trading. The message was always the same: build a trading bot, automate your strategy, and let the software make money while you sleep. It sounded like a shortcut out of financial uncertainty. I believed it.\n\nI didn't have a computer science degree. I didn't know what Python was. I had never opened a terminal. I didn't even own a laptop.\n\nAll I had was an Android phone.\n\nEvery programming tutorial I found assumed I was sitting in front of a laptop. Every YouTube video seemed to begin with the same silent assumption: of course you have a computer.\n\nI didn't.\n\nBuying one wasn't an option, so instead of waiting, I searched for another way.\n\nThat search led me to an application called Termux.\n\nAt first, I had no idea what I was looking at. A black screen with a blinking cursor appeared in front of me. People online called it a \"terminal,\" but I didn't know what that meant. I copied commands from tutorials without understanding them, hoping something would happen.\n\nThe first successful command I ever ran wasn't impressive. It simply updated packages.\n\nTo an experienced programmer, that's almost meaningless.\n\nTo me, it felt like I had unlocked a secret door.\n\nSoon after came Python — then errors, then more errors. Every time I solved one problem, another appeared.\n\nInstalling scientific libraries like NumPy became one of the biggest challenges. Video after video insisted it couldn't be done on an Android phone; forum posts warned it wasn't worth trying. More than once, I wondered whether everyone else was right and whether I should simply give up until I could buy a laptop.\n\nInstead, I developed a routine. Whenever I got stuck, I copied the error message and asked an AI assistant to explain it. If one answer didn't work, I compared it with another. ChatGPT became my primary teacher. Claude explained concepts differently. DeepSeek occasionally suggested another approach. GitHub discussions filled in the gaps. Then I went back to Termux and tried again.\n\nIt wasn't magic. The AI didn't write perfect code for me. It didn't eliminate frustration. It certainly didn't replace persistence.\n\nBut it did something that search engines rarely managed to do.\n\nIt explained.\n\nInstead of scrolling through unrelated forum posts for hours, I could ask a question in plain English and get an explanation that matched my level. When I still didn't understand, I asked again.\n\nIronically, the trading bot that had motivated me in the first place became less important. Somewhere between debugging Python scripts and fighting installation errors, I noticed something unexpected.\n\nI wasn't enjoying the idea of making money anymore.\n\nI was enjoying programming.\n\nAcross much of Africa, the smartphone has quietly become the primary computing device; by early 2024, roughly three-quarters of web traffic on the continent came through mobile phones. For millions of people, the phone is not a companion to a laptop — it is the computer. Yet coding courses and tutorials still assume a desktop, stable broadband and a machine that installs every tool with a single command.\n\nThat assumption leaves out millions of aspiring developers. The barrier was never talent. It was access.\n\nGenerative AI has not erased those barriers. It has begun to lower one of the most important ones: the cost of getting stuck.\n\nBefore tools like ChatGPT became widely available, a beginner facing an unfamiliar error could search forum posts, watch another tutorial, hope — or give up. Today, learners can ask for an explanation instead of searching for an answer, and have a conversation about an error instead of staring at it for hours.\n\nProgramming has never been only about writing code. It is about solving problems, and beginners spend far more time confused than they do typing. AI does not remove that confusion. What it changes is how long someone remains trapped by it.\n\nWhen NumPy refused to install on my phone, I didn't solve the problem because AI handed me a perfect answer. I solved it because I could keep asking better questions. Every failed attempt became another conversation instead of another dead end.\n\nLearning stopped feeling like an exam. It started feeling like a dialogue.\n\nThat teacher is imperfect. It can hallucinate, misunderstand a problem or confidently produce incorrect code. Anyone who relies on it blindly will eventually run into trouble. More than once, an AI solution sent me further from the answer instead of closer.\n\nBut perfection was never the point. The breakthrough was accessibility.\n\nA teenager with an Android phone in Lagos can now ask the same programming questions that a university student in London or San Francisco asks. The conversation is available in a way it wasn't a few years ago.\n\nThe old image of a programmer — someone behind an expensive computer in a well-equipped office — is quietly changing. Another image deserves attention: a young developer switching between a terminal app, a browser, GitHub and an AI assistant on a phone balanced in the palm of one hand.\n\nThe tools are different. The determination is the same.\n\nThe path into software engineering always began with the same first step: buy a computer. What if it no longer has to?\n\nFor many families, the phone is not a secondary device — it is the only digital device they own, and it is becoming a classroom.\n\nThis doesn't mean smartphones are replacing laptops. Professional development still benefits from larger screens and full operating systems. Even after years of coding on my phone, I still want a laptop.\n\nBut wanting a laptop and needing one to begin are not the same thing.\n\nWhen I started, I believed the absence of a laptop excluded me from programming. Yet every problem I solved made that assumption harder to believe.\n\nEventually, I wasn't just experimenting anymore. I was building. I developed trading bots. I created analytical tools. I built a React-based training application for my workplace, where it began helping new staff learn their jobs. None of those projects erased the limitations of my phone. They simply proved those limitations weren't absolute.\n\nHow many potential developers never begin because they accept the same assumptions I once did?\n\nAI doesn't provide electricity during power cuts. It doesn't reduce the price of mobile data. What it can do is reduce the penalty for learning alone.\n\nThe biggest misconception about learning with AI is that it turns programming into something easy. It doesn't. You still have to think. You still have to fail. You still have to spend hours trying to understand why code that looked correct refuses to run. AI cannot replace that process.\n\nWhat it can replace is the feeling that you're completely alone while going through it.\n\nLooking back, I don't think any AI tool made me a developer. Curiosity did. Persistence did. Failure did. AI simply made it possible to stay in the game long enough for those qualities to matter.\n\nWhen people hear my story, they usually ask the wrong question.\n\n\"Can you really build software on a phone?\"\n\nThe answer is yes. But that isn't the interesting part. The important question is why so many people believe you can't.\n\nThe laptop was more than a tool — it was a symbol of who belonged in technology. If you didn't own one, it was easy to assume software engineering wasn't for you.\n\nThe limitations are real — power cuts, expensive data, small screens. AI cannot solve any of them.\n\nBut it can change where the starting line is.\n\nTalent is universal. Opportunity is not.\n\nI believed that once. I was wrong.\n\nThe phone in my pocket did not remove every barrier. It simply removed my excuse for never starting.\n\nThe trading bot that first pushed me toward programming never made me rich. I lost money chasing that dream. At the time, I thought I had failed.\n\nNow I see that failure differently.\n\nWithout it, I might never have opened Termux. I might never have learned Python. I might never have built software that other people actually used.\n\nThe internet sold me the dream of easy money.\n\nInstead, it gave me something far more valuable: a skill.\n\nThat is why I no longer believe the most important question about AI is whether it will replace programmers. The more interesting question is whether it will create millions of new ones.\n\nThe next generation of developers may not come from the places we expect. They may begin exactly where I did — on an ordinary Android phone, asking an AI one more question, refusing to give up after one more error message.\n\nFor me, that journey began with the hope of building a trading bot.\n\nIt ended with something I never planned to become.\n\nA developer."}], "v22": 1, "v23": 1, "v24": 1, "v25": 1, "v26": 1, "v27": 1, "v28": 1, "v29": 1, "v30": 1, "v31": 1, "v32": 1};

    if(o.pitchDate&&ACTIVE.indexOf(o.status)>-1){
      if(d>=(o.closeDays||42)) needs.push({act:"Close it",what:esc(o.name)+" — "+d+" days out, past its close date ( "+ST_LABEL[o.status]+" )",id:o.id});
      else if(o.status==="PITCHED"&&d>=(o.nudgeDays||21)) needs.push({act:"Send reminder",what:esc(o.name)+" — promised nudge was "+fmt(addDays(o.pitchDate,o.nudgeDays||21)),id:o.id});
      else if(o.status==="NUDGED1"&&d>=(o.nudgeDays||21)*2) needs.push({act:"Last reminder",what:esc(o.name)+" — two nudge windows have passed",id:o.id});
    }
    if(o.status==="YES"&&!o.publishedLink) needs.push({act:"Write & send",what:esc(o.name)+" said YES — finish the piece and deliver"});
    if(o.status==="PUBLISHED") needs.push({act:"Chase payment",what:esc(o.name)+" — published. Money should follow"});
    if(o.status==="PITCHED"&&!o.pitchDate&&o.box==="OPEN") needs.push({act:"Pitch it",what:esc(o.name)+" — box is open, no pitch sent yet"});
  });
  h+='<div class="shead"><span class="micro">Needs you now</span><span class="cnt">'+(needs.length?needs.length+" thing"+(needs.length===1?"":"s"):"all quiet")+'</span></div>';
  h+=needs.length?needs.map(function(n){ return '<div class="need"><span class="n-act micro" style="color:var(--accent)">'+esc(n.act)+'</span><span class="n-what">'+n.what+'</span></div>'; }).join("")
    :'<p class="empty">Nothing is due. Write something new while you wait.</p>';

  var quiet=state.outlets.filter(function(o){ return o.pitchDate&&ACTIVE.indexOf(o.status)>-1&&daysOut(o)<(o.nudgeDays||21); });
  h+='<div class="shead"><span class="micro">Waiting quietly</span><span class="cnt">'+quiet.length+'</span></div>';
  h+=quiet.length?quiet.map(function(o){ return '<div class="need"><span class="n-act micro">'+fmt(o.pitchDate)+'</span><span class="n-what">'+esc(o.name)+' <i style="color:var(--faint)">— reminder '+fmt(addDays(o.pitchDate,o.nudgeDays||21))+'</i></span><span class="n-day">day '+daysOut(o)+'</span></div>'; }).join("")
    :'<p class="empty">No live pitches waiting. The ledger is hungry — send one.</p>';

  h+='<div class="shead"><span class="micro">This week\'s rules</span></div>';
  h+=(state.tasks||[]).map(function(t,i){ return '<div class="task'+(t.done?" done":"")+'"><input type="checkbox" data-task="'+i+'"'+(t.done?" checked":"")+'><span>'+esc(t.t)+'</span></div>'; }).join("");
  return h;
}

/* ================= LEDGER ================= */
function renderLedger(){
  var f=ledgerFilter;
  var list=state.outlets.slice().sort(function(a,b){ return (b.pitchDate||"9999")<(a.pitchDate||"9999")?-1:1; });
  if(f!=="ALL") list=list.filter(function(o){ return o.status===f; });
  var chips='<div class="chips"><button class="fchip'+(f==="ALL"?" on":"")+'" data-filter="ALL">All ('+state.outlets.length+')</button>';
  STATUS.forEach(function(s){ var n=state.outlets.filter(function(o){return o.status===s;}).length; if(n) chips+='<button class="fchip'+(f===s?" on":"")+'" data-filter="'+s+'">'+ST_LABEL[s]+" ("+n+')</button>'; });
  chips+='</div>';
  return chips+list.map(entryHtml).join("")||chips;
}

/* ================= BOXES ================= */
function renderBoxes(){
  var h='<p class="empty" style="padding-top:0">Each story owns its scenes. What is in one box may not appear in another — this is how one life becomes many paid stories.</p>';
  (state.boxes||[]).forEach(function(bx){
    var cls=bx.status==="OPEN"?"openb":bx.status==="PAUSED"?"paused":"sealed";
    h+='<div class="boxcard '+cls+'"><div style="display:flex;justify-content:space-between;gap:10px"><h3>'+esc(bx.name)+'</h3><span class="micro">'+esc(bx.status||"")+'</span></div>';
    if(bx.claim) h+='<div class="e-claim">“'+esc(bx.claim)+'”</div>';
    if(bx.kit&&bx.kit.length){ h+='<div class="boxkit micro" style="margin-top:8px">In this box</div><ul class="boxkit">'+bx.kit.map(function(k){return "<li>"+esc(k)+"</li>";}).join("")+'</ul>'; }
    if(bx.offLimits&&bx.offLimits.length){ h+='<div class="boxkit micro">Belongs to other stories — never use here</div><ul class="boxkit">'+bx.offLimits.map(function(k){return "<li>"+esc(k)+"</li>";}).join("")+'</ul>'; }
    h+='<div class="bigbtns"><button class="bbtn gray" data-act="editbox" data-id="'+esc(bx.id)+'">✏️ Edit</button></div></div>';
  });
  h+='<div class="bigbtns"><button class="bbtn" data-act="newbox">＋ New story box</button></div>';
  return h;
}

/* ================= OPPS ================= */
function renderOpps(){
  var h='<p class="empty" style="padding-top:0">Places to publish and earn — no gatekeeper needed. Tier 1 is fastest.</p>';
  var tiers={};
  (state.opps||[]).forEach(function(o){ (tiers[o.tier||3]=tiers[o.tier||3]||[]).push(o); });
  Object.keys(tiers).sort().forEach(function(t){
    h+='<div class="shead"><span class="micro">Tier '+t+'</span><span class="cnt">'+tiers[t].length+'</span></div>';
    tiers[t].forEach(function(o){
      h+='<div class="opp"><div class="o-tier">'+t+'</div><div class="o-body"><div class="o-name">'
        +(o.link?'<a href="'+esc(o.link)+'" target="_blank" rel="noopener">'+esc(o.name)+'</a>':esc(o.name))
        +(o.status==="started"?' <span class="micro" style="color:var(--green)">· started</span>':o.status==="earned"?' <span class="micro" style="color:var(--gold)">· earned ✓</span>':"")
        +'</div><div class="o-pay">'+esc(o.pay||"")+'</div>'+(o.how?'<div class="o-note">'+esc(o.how)+'</div>':"")+(o.notes?'<div class="o-note" style="color:var(--faint)">'+esc(o.notes)+'</div>':"")
        +'</div><button class="bbtn gray" data-act="opp" data-id="'+esc(o.id)+'">→</button></div>';
    });
  });
  return h;
}

/* ================= DRAFTS ================= */
function renderDrafts(){
  if(curDraft){
    var d=state.drafts.find(function(x){return x.id===curDraft;});
    if(d){ var wc=(d.text||"").trim()?((d.text||"").trim().split(/\s+/).length):0;
      return '<div class="shead"><span class="micro">'+esc(d.title||"Untitled draft")+'</span></div>'
        +'<div class="field"><input id="d_title" value="'+esc(d.title)+'" placeholder="Draft title"></div>'
        +'<textarea class="darea" id="d_text" placeholder="Write here…">'+esc(d.text)+'</textarea>'
        +'<div style="display:flex;justify-content:space-between;align-items:center"><div class="wc" id="wc">'+wc+' words · saved '+fmt(d.updated)+'</div>'
        +'<div class="bigbtns" style="margin:0"><button class="bbtn" data-act="copydraft">⧉ Copy</button><button class="bbtn gray" data-act="closedraft">← All drafts</button><button class="bbtn red" data-act="deldraft">Delete</button></div></div>';
    }
  }
  var h='<div class="shead"><span class="micro">Drafts pad</span><span class="cnt">'+state.drafts.length+'</span></div>';
  h+=state.drafts.map(function(d){
    var t=(d.text||"").trim();
    var wc=t?t.split(/\s+/).length+" words \u00b7 ":"";
    return '<div class="draftrow" data-act="opendraft" data-id="'+esc(d.id)+'"><span class="d-title">'+esc(d.title||"Untitled")+'</span><span class="d-meta">'+wc+fmt(d.updated)+'</span></div>';
  }).join("");
  h+='<div class="bigbtns"><button class="bbtn green" data-act="newdraft">＋ New draft</button></div>';
  return h;
}
function saveDraftNow(){
  var d=state.drafts.find(function(x){return x.id===curDraft;}); if(!d) return;
  var t=document.getElementById("d_title"), x=document.getElementById("d_text"); if(!t||!x) return;
  d.title=t.value; d.text=x.value; d.updated=todayISO(); save(state);
  var wc=document.getElementById("wc"); if(wc) wc.textContent=(d.text.trim()?d.text.trim().split(/\s+/).length:0)+" words · saved just now";
}

/* ================= SETTINGS ================= */
function renderSettings(){
  var st=statsCalc();
  var h='<div class="shead"><span class="micro">The numbers</span></div><div class="stats">'
    +'<div class="stat"><b>'+state.outlets.length+'</b><span class="micro">outlets</span></div>'
    +'<div class="stat"><b>'+st.sent+'</b><span class="micro">pitched</span></div>'
    +'<div class="stat"><b>'+st.waiting+'</b><span class="micro">waiting</span></div>'
    +'<div class="stat"><b>'+st.yes+'</b><span class="micro">accepted</span></div></div>';
  h+='<div class="shead"><span class="micro">This journal</span></div>';
  h+='<div class="field"><label class="micro">Journal name</label><input id="appname" value="'+esc(state.appName||"PitchLedger")+'"><div class="hint">Changes the masthead.</div></div>';
  h+='<div class="bigbtns"><button class="bbtn" data-act="saveapp">Save name</button>'
    +'<button class="bbtn" data-act="export">⬇ Export backup</button>'
    +'<button class="bbtn" data-act="import">⬆ Import backup</button>'
    +'<button class="bbtn gray" data-act="forceupdate">Force update</button>'
    +'<button class="bbtn red" data-act="reset">Reset to examples</button>'
    +'<button class="bbtn red" data-act="wipe">Wipe everything</button></div>';
  h+='<input type="file" id="importfile" accept="application/json" style="display:none">';
  h+='<p class="hint" style="margin-top:14px">Everything lives on this device (offline). Export a backup before switching phones. Added to Home Screen, it works as an app.</p>';
  return h;
}

/* ================= MODALS ================= */
function openModal(html){ var m=document.getElementById("modal"); m.innerHTML=html; m.classList.add("on"); }
function closeModal(){ document.getElementById("modal").classList.remove("on"); }
function field(n,label,val,ph,hint,type){ return '<div class="field"><label class="micro">'+label+'</label><input '+(type||'')+' id="'+n+'" value="'+esc(val==null?"":val)+'" placeholder="'+esc(ph||"")+'">'+(hint?'<div class="hint">'+hint+'</div>':"")+'</div>'; }
function area(n,label,val,ph){ return '<div class="field"><label class="micro">'+label+'</label><textarea id="'+n+'" placeholder="'+esc(ph||"")+'">'+esc(val==null?"":val)+'</textarea></div>'; }
function outletForm(o){
  o=o||{};
  var h='<div class="modal-box"><h3>'+(o.id?"Edit — "+esc(o.name):"A new pitch")+'</h3>';
  h+=field("f_name","Publication *",o.name,"e.g. TechCabal");
  h+=field("f_website","Website",o.website,"https://…");
  h+='<div class="field"><label class="micro">Status</label><select id="f_status">'+STATUS.map(function(s){return '<option'+(o.status===s?" selected":"")+' value="'+s+'">'+ST_LABEL[s]+'</option>';}).join("")+'</select></div>';
  h+='<div class="field"><label class="micro">Story box</label><select id="f_box">'+["OPEN","SEALED","PAUSED","CLOSED"].map(function(b){return '<option'+(o.box===b?" selected":"")+'>'+b+'</option>';}).join("")+'</select><div class="hint">Open = ready to write · Sealed = waiting on a yes</div></div>';
  h+=field("f_pitch","Date pitched",o.pitchDate,"","This starts the day counter.",'type="date"');
  h+=field("f_nudge","Reminder after (days)",o.nudgeDays==null?21:o.nudgeDays,"21",'type="number" min="1"');
  h+=field("f_close","Close it after (days)",o.closeDays==null?42:o.closeDays,"42",'type="number" min="1"');
  h+=field("f_editor","Editor",o.editorName,"name");
  h+=field("f_email","Editor email",o.editorEmail,"");
  h+=area("f_claim","The idea (one sentence)",o.claim,"What this story argues");
  h+=area("f_kit","My material for this story",o.kit&&o.kit.join?o.kit.join("\n"):o.kit,"Scenes only this story can use");
  h+=area("f_off","Off limits (belongs to other stories)",o.offLimits&&o.offLimits.join?o.offLimits.join("\n"):o.offLimits,"");
  h+=field("f_words","Length",o.wordCount,"e.g. 1,000–1,500");
  h+=field("f_pay","Pay",o.pay,"e.g. ₦150,000");
  h+=field("f_method","Payment method",o.payMethod,"");
  h+=field("f_ai","🤖 AI policy",o.aiPolicy,"checked per outlet");
  h+=field("f_publink","Published link",o.publishedLink,"https://…");
  h+=area("f_notes","Notes",o.notes,"");
  h+='<div class="modal-actions"><button class="bbtn green" data-act="saveoutlet" data-id="'+esc(o.id||"")+'">Save entry</button><button class="bbtn gray" data-act="closemodal">Cancel</button></div></div>';
  return h;
}
function boxForm(b){
  b=b||{};
  var h='<div class="modal-box"><h3>'+(b.id?"Edit — "+esc(b.name):"New story box")+'</h3>';
  h+=field("b_name","Story name *",b.name,"e.g. The Phone-Coding Essay");
  h+='<div class="field"><label class="micro">Status</label><select id="b_status">'+["OPEN","SEALED","PAUSED","CLOSED"].map(function(s){return '<option'+(b.status===s?" selected":"")+'>'+s+'</option>';}).join("")+'</select></div>';
  h+=area("b_claim","The claim",b.claim,"");
  h+=area("b_kit","In this box (one per line)",b.kit&&b.kit.join?b.kit.join("\n"):b.kit,"");
  h+=area("b_off","Off limits (one per line)",b.offLimits&&b.offLimits.join?b.offLimits.join("\n"):b.offLimits,"");
  h+='<div class="modal-actions"><button class="bbtn green" data-act="savebox" data-id="'+esc(b.id||"")+'">Save box</button><button class="bbtn gray" data-act="closemodal">Cancel</button></div></div>';
  return h;
}

/* ================= ACTIONS ================= */
function toast(m){ var t=document.getElementById("toast"); t.textContent=m; t.classList.add("on"); clearTimeout(t._x); t._x=setTimeout(function(){t.classList.remove("on");},2200); }
function markStatus(id,to){
  var o=state.outlets.find(function(x){return x.id===id;}); if(!o) return;
  o.status=to; o.log=o.log||[];
  o.log.push({d:todayISO(),e:"Marked: "+ST_LABEL[to]+(to==="YES"?" 🎉":to==="PAID"?" 💰":"")});
  save(state); renderAll(); toast(o.name+" → "+ST_LABEL[to]);
}
function saveOutlet(id){
  function g(x){ var e=document.getElementById(x); return e?e.value:""; }
  var isNew=!id;
  var o=isNew?{id:"o"+Date.now(),log:[]}:state.outlets.find(function(x){return x.id===id;});
  if(!o) return;
  o.name=g("f_name")||"Untitled"; o.website=g("f_website"); o.status=g("f_status"); o.box=g("f_box");
  o.pitchDate=g("f_pitch"); o.nudgeDays=parseInt(g("f_nudge"),10)||21; o.closeDays=parseInt(g("f_close"),10)||42;
  o.editorName=g("f_editor"); o.editorEmail=g("f_email"); o.claim=g("f_claim");
  o.kit=g("f_kit"); o.offLimits=g("f_off");
  o.wordCount=g("f_words"); o.pay=g("f_pay"); o.payMethod=g("f_method"); o.aiPolicy=g("f_ai");
  o.publishedLink=g("f_publink"); o.notes=g("f_notes");
  if(isNew){ o.log=[{d:todayISO(),e:"Entry opened in the journal."}]; state.outlets.push(o); }
  save(state); closeModal(); renderAll(); toast("Saved ✓");
}
function saveBox(id){
  function g(x){ var e=document.getElementById(x); return e?e.value:""; }
  function lines(v){ return v?v.split("\n").map(function(x){return x.trim();}).filter(Boolean):[]; }
  var isNew=!id;
  var b=isNew?{id:"b"+Date.now()}:state.boxes.find(function(x){return x.id===id;});
  if(!b) return;
  b.name=g("b_name")||"Untitled box"; b.status=g("b_status"); b.claim=g("b_claim"); b.kit=lines(g("b_kit")); b.offLimits=lines(g("b_off"));
  if(isNew) state.boxes.push(b);
  save(state); closeModal(); renderAll(); toast("Box saved ✓");
}
function exportData(){
  var blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  var a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="pitchledger-backup-"+todayISO()+".json";
  document.body.appendChild(a); a.click(); setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},500);
}
function importData(file){
  var r=new FileReader();
  r.onload=function(){ try{ var s=JSON.parse(r.result); if(!s.outlets) throw 0;
    if(!s.drafts)s.drafts=[]; state=s; save(state); renderAll(); toast("Backup imported ✓");
  }catch(e){ toast("That file isn't a PitchLedger backup"); } };
  r.readAsText(file);
}
function oppCycle(id){
  var o=state.opps.find(function(x){return x.id===id;}); if(!o) return;
  o.status=o.status==="earned"?"not-started":o.status==="started"?"earned":"started";
  save(state); renderAll();
}

/* ================= EVENTS ================= */
document.addEventListener("click",function(e){
  var t=e.target.closest("[data-nav],[data-filter],[data-act],[data-new]"); if(!t) return;
  if(t.hasAttribute("data-new")){ openModal(outletForm(null)); return; }
  if(t.hasAttribute("data-nav")){ setView(t.getAttribute("data-nav")); return; }
  if(t.hasAttribute("data-filter")){ ledgerFilter=t.getAttribute("data-filter"); renderAll(); return; }
  var act=t.getAttribute("data-act"), id=t.getAttribute("data-id");
  if(act==="st") markStatus(id,t.getAttribute("data-to"));
  else if(act==="edit"){ openModal(outletForm(state.outlets.find(function(o){return o.id===id;}))); }
  else if(act==="del"){ var o=state.outlets.find(function(x){return x.id===id;});
    if(o&&confirm("Delete "+o.name+" from the journal?")){ state.outlets=state.outlets.filter(function(x){return x.id!==id;}); save(state); renderAll(); toast("Deleted"); } }
  else if(act==="saveoutlet") saveOutlet(id||null);
  else if(act==="editbox") openModal(boxForm(state.boxes.find(function(b){return b.id===id;})));
  else if(act==="newbox") openModal(boxForm(null));
  else if(act==="savebox") saveBox(id||null);
  else if(act==="opp") oppCycle(id);
  else if(act==="opendraft"){ curDraft=id; renderAll(); }
  else if(act==="newdraft"){ var d={id:"d"+Date.now(),title:"",outlet:"",updated:todayISO(),text:""}; state.drafts.push(d); curDraft=d.id; save(state); renderAll(); setTimeout(function(){ var el=document.getElementById("d_title"); if(el) el.focus(); },50); }
  else if(act==="closedraft"){ saveDraftNow(); curDraft=null; renderAll(); }
  else if(act==="deldraft"){ if(confirm("Delete this draft?")){ state.drafts=state.drafts.filter(function(x){return x.id!==curDraft;}); curDraft=null; save(state); renderAll(); } }
  else if(act==="copydraft"){ var d=state.drafts.find(function(x){return x.id===curDraft;});
    if(d&&navigator.clipboard){ navigator.clipboard.writeText(d.text||"").then(function(){toast("Copied ✓");}); } }
  else if(act==="saveapp"){ var i=document.getElementById("appname"); state.appName=i.value||"PitchLedger"; save(state); renderAll(); toast("Saved ✓"); }
  else if(act==="export") exportData();
  else if(act==="import"){ var f=document.getElementById("importfile"); if(f) f.click(); }
  else if(act==="reset"){ if(confirm("Reset to the original examples? This replaces your data.")){ state=seed(); save(state); renderAll(); toast("Reset to examples"); } }
  else if(act==="wipe"){ if(confirm("Wipe EVERYTHING? Export a backup first!")){ state={appName:"PitchLedger",outlets:[],opps:[],boxes:[],tasks:[],drafts:[]}; save(state); renderAll(); toast("Wiped"); } }
  else if(act==="forceupdate"){ try{ if(navigator.serviceWorker){ navigator.serviceWorker.getRegistrations().then(function(rs){ rs.forEach(function(r){r.unregister();}); }); } }catch(e){} location.reload(true); }
  else if(act==="closemodal") closeModal();
});
document.addEventListener("change",function(e){
  if(e.target.hasAttribute&&e.target.hasAttribute("data-task")){
    var i=parseInt(e.target.getAttribute("data-task"),10);
    if(state.tasks&&state.tasks[i]){ state.tasks[i].done=e.target.checked; save(state); renderAll(); }
  }
  var f=document.getElementById("importfile");
  if(e.target===f&&f.files&&f.files[0]) importData(f.files[0]);
});
document.addEventListener("input",function(e){
  if(e.target.id==="d_text"||e.target.id==="d_title"){
    clearTimeout(draftTimer); draftTimer=setTimeout(saveDraftNow,700);
  }
});
document.addEventListener("keydown",function(e){ if(e.key==="Escape") closeModal(); });
document.getElementById("modal").addEventListener("click",function(e){ if(e.target.id==="modal") closeModal(); });

/* ================= BOOT ================= */
state=load();
renderAll();
setInterval(function(){ if(!document.getElementById("modal").classList.contains("on")) renderAll(); },60000);
document.addEventListener("visibilitychange",function(){ if(!document.hidden&& !document.getElementById("modal").classList.contains("on")) renderAll(); });
try{ if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(function(){}); } }catch(e){}
</script>
</body>
